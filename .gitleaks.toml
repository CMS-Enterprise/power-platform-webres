title = "power-platform-webres Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Canvas App identity exports use UUID-valued DataCardKey control identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)apps/it-governance/solution/InitialITGO/src/CanvasApps/[^/]+_AdditionalUris0_identity\.json$''',
]
regexes = [
  '''DataCardKey\d+"\s*:\s*"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}"''',
]
