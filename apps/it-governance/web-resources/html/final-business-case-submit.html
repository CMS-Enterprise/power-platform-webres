<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Case Header</title>

    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        line-height: 1.428571429;
        color: #323130;
        background-color: #faf9f8;
        margin: 0;
        padding: 12px;
      }

      .layout {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
      }

      .layout-main {
        flex: 1 1 220px;
        min-width: 0;
      }

      .layout-actions {
        flex: 0 0 auto;
        align-self: flex-start;
        text-align: right;
      }

      .layout .alert {
        margin: 0 0 12px 0;
      }

      .layout .alert:last-child {
        margin-bottom: 0;
      }

      .btn-primary {
        background-color: #0078d4;
        border: 1px solid #0078d4;
        color: #ffffff;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 400;
        border-radius: 5px;
        cursor: pointer;
        transition:
          background-color 0.15s ease-in-out,
          border-color 0.15s ease-in-out;
      }

      .btn-primary:hover {
        background-color: #106ebe;
        border-color: #106ebe;
      }

      .btn-primary:focus {
        outline: 1px solid #ffffff;
        outline-offset: 2px;
        box-shadow: 0 0 0 2px #0078d4;
      }

      .alert {
        padding: 12px 16px;
        margin: 12px 0;
        border-radius: 4px;
        border-left: 6px solid #107c10;
        background-color: #dff6dd;
        color: #0b5a0b;
      }

      .alert-error {
        border-left-color: #a80000;
        background-color: #fde7e9;
        color: #a80000;
      }

      .alert-warning {
        border-left-color: #ffbe2e;
        background-color: #fff4ce;
        color: #323130;
      }

      .hidden {
        display: none;
      }

      .missing-fields-list {
        margin: 8px 0 0 0;
        padding-left: 18px;
        max-height: min(42vh, 280px);
        overflow-y: auto;
      }

      @media (max-width: 768px) {
        body {
          padding: 8px;
        }

        .layout {
          flex-direction: column;
        }

        .layout-actions {
          order: -1;
          width: 100%;
          text-align: left;
        }
      }
    </style>

    <script>
      const PAGE_REQUIRED_FIELDS = [
        "new_internalorexternalsupportneeded",
        "new_currentprocess",
        "new_howwillcmsbenefit",
        "new_organizationalpriorityalignment",
        "new_successcriteria",
        "new_grt_feedback_implementation",
        "new_businessoruserneed",
      ];

      const SUBMITTED_BOOL = "cr69a_finalbusinesscasesubmitted";
      const SUBMITTED_DATE = "cr69a_finalbusinesscasesubmitteddate";
      const READY_FOR_REVIEW = "cr69a_readyforreview";
      const SOLUTIONS_GRID_NAMES = ["subgrid_solutions", "Subgrid_new_1"];

      const NOTIF_IDS = {
        missingFields: "final_business_case_submit_missing_fields_warning",
        success: "final_business_case_submit_success_message",
        error: "final_business_case_submit_error_message",
      };

      function getParentForm() {
        return parent && parent.Xrm && parent.Xrm.Page ? parent.Xrm.Page : null;
      }

      function getAttr(form, schema) {
        return form ? form.getAttribute(schema) : null;
      }

      function showMessage(text, isError) {
        var box = document.getElementById("submitStatus");
        if (!box) return;

        box.textContent = text || "Successfully submitted!";
        box.classList.remove("hidden");
        box.classList.remove("alert-warning");

        if (isError) {
          box.classList.add("alert-error");
        } else {
          box.classList.remove("alert-error");
        }
      }

      function showInlineMessage(text, variant) {
        var box = document.getElementById("submitStatus");
        if (!box) return;

        box.textContent = text || "";
        box.classList.remove("hidden", "alert-warning", "alert-error");

        if (variant === "warning") {
          box.classList.add("alert-warning");
        } else if (variant === "error") {
          box.classList.add("alert-error");
        }
      }

      function hideMessage() {
        var box = document.getElementById("submitStatus");
        if (!box) return;

        box.classList.add("hidden");
        box.classList.remove("alert-warning");
        box.classList.remove("alert-error");
        box.textContent = "";
      }

      function showSuccess(text) {
        showMessage(text, false);
      }

      function showError(text) {
        showMessage(text, true);
      }

      function setSubmitButtonHidden(hidden) {
        var submitButton = document.getElementById(
          "submitFinalBusinessCaseButton",
        );
        if (!submitButton) return;

        submitButton.classList.toggle("hidden", !!hidden);
      }

      function showMissingFieldsList(missingFieldLabels) {
        var container = document.getElementById("missingFieldsBox");
        var list = document.getElementById("missingFieldsList");
        if (!container || !list) return;

        list.innerHTML = "";
        (missingFieldLabels || []).forEach(function (label) {
          var li = document.createElement("li");
          li.textContent = label;
          list.appendChild(li);
        });

        container.classList.toggle(
          "hidden",
          (missingFieldLabels || []).length === 0,
        );
      }

      function hideMissingFieldsList() {
        var container = document.getElementById("missingFieldsBox");
        var list = document.getElementById("missingFieldsList");
        if (!container || !list) return;

        container.classList.add("hidden");
        list.innerHTML = "";
      }

      function clearActionNotifications(form) {
        form.ui.clearFormNotification(NOTIF_IDS.missingFields);
        form.ui.clearFormNotification(NOTIF_IDS.success);
        form.ui.clearFormNotification(NOTIF_IDS.error);
      }

      const EMBEDDED_REFRESH_METHODS = [
        "refreshRequestHelper",
        "refreshProgressTracker",
      ];

      function refreshEmbeddedHelpers(form) {
        const controls = form?.ui?.controls;
        if (!controls || typeof controls.forEach !== "function") {
          return;
        }

        controls.forEach(function (control) {
          if (
            !control ||
            control.getControlType?.() !== "webresource" ||
            typeof control.getContentWindow !== "function"
          ) {
            return;
          }

          control.getContentWindow().then(
            function (contentWindow) {
              EMBEDDED_REFRESH_METHODS.forEach(function (methodName) {
                if (typeof contentWindow[methodName] === "function") {
                  contentWindow[methodName]();
                }
              });
            },
            function () {
              // Ignore inaccessible web resource windows.
            },
          );
        });
      }

      function scheduleEmbeddedRefreshes(form) {
        [0, 300, 1200].forEach(function (delay) {
          window.setTimeout(function () {
            refreshEmbeddedHelpers(form);
          }, delay);
        });
      }

      function showFormNotification(form, message, level, uniqueId) {
        form.ui.clearFormNotification(uniqueId);
        form.ui.setFormNotification(message, level, uniqueId);
      }

      function showMissingFieldsWarning(form, missingFieldLabels) {
        const totalMissing = (missingFieldLabels || []).length;
        const message =
          "Successfully saved. " +
          totalMissing +
          " required item" +
          (totalMissing === 1 ? "" : "s") +
          " missing. Please complete the highlighted fields before submitting.";

        showFormNotification(
          form,
          message,
          "WARNING",
          NOTIF_IDS.missingFields,
        );

        showInlineMessage(
          "Saved as draft. Please complete the missing required fields before submitting.",
          "warning",
        );
        showMissingFieldsList(missingFieldLabels || []);
        setSubmitButtonHidden(false);
      }

      // UI depends only on Ready For Review
      function updateUIFromReadyForReview() {
        const form = getParentForm();
        if (!form) return;

        const readyForReviewAttr = getAttr(form, READY_FOR_REVIEW);
        const ready = !!(readyForReviewAttr && readyForReviewAttr.getValue());

        if (ready) {
          clearActionNotifications(form);
          showSuccess("Business Case submitted. Waiting for feedback.");
          hideMissingFieldsList();
          setSubmitButtonHidden(true);
        } else {
          clearActionNotifications(form);
          hideMessage();
          hideMissingFieldsList();
          setSubmitButtonHidden(false);
        }
      }

      function hookReadyForReviewOnChange() {
        const form = getParentForm();
        if (!form) return;

        const readyForReviewAttr = getAttr(form, READY_FOR_REVIEW);
        if (readyForReviewAttr && readyForReviewAttr.addOnChange) {
          readyForReviewAttr.addOnChange(updateUIFromReadyForReview);
        }
      }

      function submitBusinessCase() {
        const form = getParentForm();
        if (!form) {
          console.error("Could not access parent form context.");
          return;
        }

        clearActionNotifications(form);
        hideMessage();
        hideMissingFieldsList();

        const submitButton = document.getElementById(
          "submitFinalBusinessCaseButton",
        );
        if (submitButton) {
          submitButton.disabled = true;
        }

        const validationResult = validateFields(form);

        if (!validationResult.allValid) {
          form.data.save().then(
            function () {
              scheduleEmbeddedRefreshes(form);
              showMissingFieldsWarning(form, validationResult.missingFieldLabels);
              if (submitButton) {
                submitButton.disabled = false;
              }
            },
            function (err) {
              console.error(
                "Save failed:",
                err && err.message ? err.message : err,
              );
              showError(
                "Your business case could not be submitted, and the draft could not be saved. Please try again or refresh the form.",
              );
              if (submitButton) {
                submitButton.disabled = false;
              }
            },
          );
          return;
        }

        try {
          const submittedAttr = getAttr(form, SUBMITTED_BOOL);
          if (submittedAttr) {
            submittedAttr.setValue(true);
          }

          const submittedDateAttr = getAttr(form, SUBMITTED_DATE);
          if (submittedDateAttr && !submittedDateAttr.getValue()) {
            submittedDateAttr.setValue(new Date());
          }

          const readyForReviewAttr = getAttr(form, READY_FOR_REVIEW);
          if (readyForReviewAttr) {
            readyForReviewAttr.setValue(true);
          }

          clearActionNotifications(form);

          form.data.save().then(
            function () {
              scheduleEmbeddedRefreshes(form);
              if (parent.lockAllFields) {
                parent.lockAllFields(form);
              } else {
                console.warn(
                  "lockAllFields function not found on parent window",
                );
              }

              updateUIFromReadyForReview();
            },
            function (err) {
              console.error(
                "Save failed:",
                err && err.message ? err.message : err,
              );
              showError(
                "Failed to submit. Please try again or contact support.",
              );
              if (submitButton) {
                submitButton.disabled = false;
              }
            },
          );
        } catch (e) {
          console.error("Unexpected error during submit:", e);
          showError("An unexpected error occurred. Please contact support.");
          if (submitButton) {
            submitButton.disabled = false;
          }
        }
      }

      function validateFields(form) {
        let allValid = true;
        const missingFieldLabels = [];

        PAGE_REQUIRED_FIELDS.forEach(function (fieldName) {
          const attribute = form.getAttribute(fieldName);
          const control = form.getControl(fieldName);

          if (!attribute) {
            allValid = false;
            missingFieldLabels.push(fieldName);
            return;
          }

          const value = attribute.getValue();
          const isEmpty =
            value === null ||
            value === undefined ||
            (typeof value === "string" && value.trim() === "") ||
            (Array.isArray(value) && value.length === 0);

          if (isEmpty) {
            allValid = false;
            missingFieldLabels.push(
              control && typeof control.getLabel === "function"
                ? control.getLabel()
                : fieldName,
            );
          }
        });

        const solutionsGrid = getFirstAvailableControl(
          form,
          SOLUTIONS_GRID_NAMES,
        );
        const grid = solutionsGrid && solutionsGrid.getGrid
          ? solutionsGrid.getGrid()
          : null;

        let solutionCount = null;
        if (grid) {
          if (typeof grid.getTotalRecordCount === "function") {
            solutionCount = grid.getTotalRecordCount();
          }

          if (
            (solutionCount === null || solutionCount === undefined) &&
            typeof grid.getRows === "function"
          ) {
            const rows = grid.getRows();
            if (rows && typeof rows.getLength === "function") {
              solutionCount = rows.getLength();
            }
          }
        }

        console.log("[final-business-case-submit] solutions grid validation", {
          gridFound: !!grid,
          solutionCount,
        });

        if (solutionCount === null || solutionCount === undefined) {
          allValid = false;
          missingFieldLabels.push("Solutions (add at least one)");
        } else if (solutionCount <= 0) {
          allValid = false;
          missingFieldLabels.push("Solutions (add at least one)");
        }

        return {
          allValid: allValid,
          missingFieldLabels: missingFieldLabels,
        };
      }

      function getFirstAvailableControl(form, controlNames) {
        for (var index = 0; index < controlNames.length; index += 1) {
          var control = form.getControl(controlNames[index]);
          if (control) {
            return control;
          }
        }

        return null;
      }

      const INIT_MAX_ATTEMPTS = 10;
      const INIT_RETRY_DELAY_MS = 500;

      function isParentFormReady() {
        try {
          const form = getParentForm();
          return !!(form && form.data);
        } catch (e) {
          return false;
        }
      }

      function initUIWithRetry(attempt) {
        var currentAttempt = attempt || 1;

        if (!isParentFormReady()) {
          if (currentAttempt >= INIT_MAX_ATTEMPTS) {
            console.warn(
              "Parent form context not ready after maximum retries; UI may not reflect correct state.",
            );
            return;
          }

          setTimeout(function () {
            initUIWithRetry(currentAttempt + 1);
          }, INIT_RETRY_DELAY_MS);
          return;
        }

        hookReadyForReviewOnChange();
        updateUIFromReadyForReview();
      }

      document.addEventListener("DOMContentLoaded", function () {
        initUIWithRetry(1);
      });
    </script>
  </head>

  <body>
    <div class="layout">
      <div class="layout-main">
        <div
          id="submitStatus"
          class="alert hidden"
          role="status"
          aria-live="polite"
        ></div>

        <div id="missingFieldsBox" class="alert alert-warning hidden">
          <div><strong>Missing required fields</strong></div>
          <ul id="missingFieldsList" class="missing-fields-list"></ul>
        </div>
      </div>

      <div class="layout-actions">
        <button
          id="submitFinalBusinessCaseButton"
          class="btn-primary"
          onclick="submitBusinessCase()"
        >
          Submit Final Business Case
        </button>
      </div>
    </div>
  </body>
</html>
