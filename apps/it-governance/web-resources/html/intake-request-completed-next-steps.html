<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Next Steps</title>
    <style>
      :root {
        --itgov-text: #323130;
        --itgov-card-radius: 12px;
        --itgov-card-border: rgba(0, 0, 0, 0.08);
        --itgov-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        --itgov-info-bg: #eff6fc;
        --itgov-info-border: #5c9bd5;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--itgov-text);
        background: transparent;
        line-height: 1.5;
        margin: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 16px 0;
        color: #1f1f1f;
      }

      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 28px 0 8px 0;
        color: #1f1f1f;
      }

      p {
        margin: 0 0 12px 0;
        font-size: 14px;
      }

      .helper-card {
        border-radius: var(--itgov-card-radius);
        padding: 16px 18px;
        box-shadow: var(--itgov-card-shadow);
        border: 1px solid var(--itgov-card-border);
      }

      .helper-card--info {
        background: var(--itgov-info-bg);
        border-color: var(--itgov-info-border);
      }

      .helper-title {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #1f1f1f;
      }

      ul {
        margin: 8px 0 12px 18px;
        padding: 0 0 0 12px;
      }

      li {
        margin-bottom: 4px;
        font-size: 14px;
      }

      a {
        color: #005ea2;
        text-decoration: underline;
      }

      a:hover {
        text-decoration: none;
      }

      .cta-link {
        display: inline-block;
        margin-top: 4px;
        font-size: 14px;
        font-weight: 500;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="helper-card helper-card--info" role="status" aria-live="polite">
        <div class="helper-title">
          <span aria-hidden="true">ℹ️</span>
          <span>
            The Governance Review Board (GRB) and Governance Review Team (GRT)
            recommend that you complete the following next steps as part of the
            Governance Review process and your ongoing project.
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
