<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Helper</title>
    <style>
      :root {
        --itgov-text: #323130;
        --itgov-card-radius: 12px;
        --itgov-card-border: rgba(0, 0, 0, 0.08);
        --itgov-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        --itgov-info-bg: #eff6fc;
        --itgov-info-border: #5c9bd5;
        --itgov-action-bg: #dceeff;
        --itgov-action-border: #0078d4;
        --itgov-wait-bg: #eef3f8;
        --itgov-wait-border: #7f95ad;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: transparent;
        color: var(--itgov-text);
      }

      .helper-card {
        border-radius: var(--itgov-card-radius);
        padding: 16px 18px;
        box-shadow: var(--itgov-card-shadow);
        border: 1px solid var(--itgov-card-border);
      }

      .helper-title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .helper-body {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      .helper-emphasis {
        font-weight: 700;
      }

      .helper-card--info {
        background: var(--itgov-info-bg);
        border-color: var(--itgov-info-border);
      }

      .helper-card--action {
        background: var(--itgov-action-bg);
        border-color: var(--itgov-action-border);
      }

      .helper-card--wait {
        background: var(--itgov-wait-bg);
        border-color: var(--itgov-wait-border);
      }

      .icon {
        font-size: 22px;
        line-height: 1;
      }
    </style>
    <script>
      const READY_FOR_REVIEW = "cr69a_readyforreview";
      const CURRENT_PROCESS_STATUS = "new_admingovernanceprocessstep";
      const GRT_MEETING_DATE = "cr69a_grtmeetingdate";
      const GRB_REVIEW_MEETING_DATE = "cr69a_grbreviewmeetingdate";
      const DECISION = "easi_decision";
      const MAX_WAIT_MS = 15000;
      const WAIT_INTERVAL_MS = 250;
      let listenersRegistered = false;

      const PROCESS_STEPS = {
        DRAFT: 971270006,
        INTAKE_REQUEST_REVIEW: 971270000,
        DRAFT_BUSINESS_CASE: 971270001,
        GRT_MEETING: 971270002,
        FINAL_BUSINESS_CASE: 971270003,
        GRB_REVIEW: 971270004,
        FINISHED: 971270009,
      };

      const DECISIONS = {
        ISSUE_LCID: 971270000,
        NOT_AN_IT_GOV_REQUEST: 971270001,
        NOT_APPROVED_BY_GRB: 971270002,
        CLOSE_REQUEST: 971270003,
      };

      function getParentForm() {
        return parent && parent.Xrm && parent.Xrm.Page ? parent.Xrm.Page : null;
      }

      function getAttr(form, schema) {
        return form ? form.getAttribute(schema) : null;
      }

      function formatMeetingDate(value) {
        if (!value) return "";

        const date = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }

        try {
          return new Intl.DateTimeFormat(undefined, {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric",
          }).format(date);
        } catch {
          return date.toLocaleDateString();
        }
      }

      function render(state, context = {}) {
        const card = document.getElementById("card");
        const icon = document.getElementById("icon");
        const title = document.getElementById("titleText");
        const subtitle = document.getElementById("subtitleText");

        if (!card || !icon || !title || !subtitle) return;

        card.classList.remove(
          "helper-card--info",
          "helper-card--action",
          "helper-card--wait",
        );

        if (state === "draft-requester") {
          card.classList.add("helper-card--info");
          icon.textContent = "📝";
          title.textContent = "Complete your Intake Request";
          subtitle.textContent =
            "Fill out the request details below and use the submit section when you are ready to send the request forward.";
        } else if (state === "draft-admin") {
          card.classList.add("helper-card--wait");
          icon.textContent = "⏳";
          title.textContent = "Your Intake Request is being reviewed";
          subtitle.textContent =
            "The Governance Admin Team is reviewing your Intake Request and will contact you if any updates or next steps are needed.";
        } else if (state === "intake-review") {
          card.classList.add("helper-card--wait");
          icon.textContent = "⏳";
          title.textContent = "Your request is under review";
          subtitle.textContent =
            "The Governance Admin Team is reviewing your Intake Request and will contact you if any updates or next steps are needed.";
        } else if (state === "business-case-requester") {
          card.classList.add("helper-card--action");
          icon.textContent = "📝";
          title.textContent = "Complete the Business Case";
          subtitle.textContent =
            "Fill out the Business Case section below, add at least one Solution, and submit the Business Case when you are ready for review. Draft a Business Case to communicate your business need, possible solutions and their associated costs. The Governance Team will review this business case and determine whether you are ready for a GRT meeting or GRB review.";
        } else if (state === "business-case-admin") {
          card.classList.add("helper-card--wait");
          icon.textContent = "⏳";
          title.textContent = "Business Case submitted";
          subtitle.textContent =
            "The Governance Admin Team is reviewing your Business Case and Solutions. Wait for feedback or the next step in the process.";
        } else if (state === "grt-meeting") {
          card.classList.add("helper-card--wait");
          if (context.grtScheduled) {
            icon.textContent = "📅";
            title.textContent = "Your GRT meeting has been scheduled";
            subtitle.innerHTML =
              "The Governance Admin Team has scheduled your GRT meeting" +
              (context.grtMeetingDate
                ? ' for <span class="helper-emphasis">' +
                  context.grtMeetingDate +
                  "</span>"
                : "") +
              ". Use the GRT Meeting section below to review the meeting details and prepare any requested materials.";
          } else {
            icon.textContent = "⏳";
            title.textContent = "Your GRT meeting will be scheduled";
            subtitle.textContent =
              "The Governance Admin Team is working with your team to schedule the GRT meeting. Watch the GRT Meeting section below for the meeting date and next steps.";
          }
        } else if (state === "final-business-case-requester") {
          card.classList.add("helper-card--action");
          icon.textContent = "📝";
          title.textContent = "Update the Final Business Case";
          subtitle.textContent =
            "Review any requested updates, revise the Business Case and Solutions in the Business Case section below, and resubmit when the changes are complete.";
        } else if (state === "final-business-case-admin") {
          card.classList.add("helper-card--wait");
          icon.textContent = "⏳";
          title.textContent = "Final Business Case submitted";
          subtitle.textContent =
            "The Governance Admin Team is reviewing the updated Business Case and Solutions. Wait for feedback or the next step in the process.";
        } else if (state === "grb-review") {
          card.classList.add("helper-card--wait");
          if (context.grbScheduled) {
            icon.textContent = "📅";
            title.textContent = "Your GRB review has been scheduled";
            subtitle.innerHTML =
              "The Governance Admin Team has scheduled your GRB review" +
              (context.grbMeetingDate
                ? ' for <span class="helper-emphasis">' +
                  context.grbMeetingDate +
                  "</span>"
                : "") +
              ". Use the GRB Review section below to review the meeting details and prepare for the review.";
          } else {
            icon.textContent = "⏳";
            title.textContent = "Your GRB review will be scheduled";
            subtitle.textContent =
              "The Governance Admin Team is coordinating the GRB review schedule. Watch the GRB Review section below for the meeting date and any additional preparation guidance.";
          }
        } else if (state === "finished") {
          if (context.decision === DECISIONS.ISSUE_LCID) {
            card.classList.add("helper-card--action");
            icon.textContent = "✅";
            title.textContent = "Your request has been approved";
            subtitle.textContent =
              "A Life Cycle ID (LCID) has been issued for this request.";
          } else if (context.decision === DECISIONS.NOT_APPROVED_BY_GRB) {
            card.classList.add("helper-card--wait");
            icon.textContent = "❌";
            title.textContent = "Your request was not approved";
            subtitle.textContent =
              "Review the decision details and next steps below. If additional updates are needed later, the Governance Admin Team can re-open the request.";
          } else if (context.decision === DECISIONS.NOT_AN_IT_GOV_REQUEST) {
            card.classList.add("helper-card--info");
            icon.textContent = "✖";
            title.textContent = "This is not an IT Governance request";
            subtitle.textContent =
              "The Governance Team determined that this request does not need to continue through the IT Governance process.";
          } else if (context.decision === DECISIONS.CLOSE_REQUEST) {
            card.classList.add("helper-card--info");
            icon.textContent = "⚠️";
            title.textContent = "This request has been closed";
            subtitle.innerHTML =
              "The Governance Team closed this request without issuing a decision.";
          } else {
            card.classList.add("helper-card--action");
            icon.textContent = "✅";
            title.textContent = "This request is finished";
            subtitle.textContent =
              "This request has completed the current process. If additional updates are needed later, the Governance Admin Team can re-open it.";
          }
        } else {
          card.classList.add("helper-card--info");
          icon.textContent = "ℹ️";
          title.textContent = "Request guidance";
          subtitle.textContent =
            "Step-specific guidance will appear here as the request moves through the governance process.";
        }
      }

      function updateUI() {
        const form = getParentForm();
        if (!form) return false;

        const statusAttr = getAttr(form, CURRENT_PROCESS_STATUS);
        const readyAttr = getAttr(form, READY_FOR_REVIEW);
        const grtMeetingDateAttr = getAttr(form, GRT_MEETING_DATE);
        const grbReviewMeetingDateAttr = getAttr(form, GRB_REVIEW_MEETING_DATE);
        const decisionAttr = getAttr(form, DECISION);
        const currentStatus = statusAttr ? statusAttr.getValue() : null;
        const readyForReview = !!(readyAttr && readyAttr.getValue());
        const decision = decisionAttr ? decisionAttr.getValue() : null;
        const grtMeetingDate = formatMeetingDate(
          grtMeetingDateAttr && grtMeetingDateAttr.getValue(),
        );
        const grbMeetingDate = formatMeetingDate(
          grbReviewMeetingDateAttr && grbReviewMeetingDateAttr.getValue(),
        );
        const grtScheduled = !!(
          grtMeetingDateAttr && grtMeetingDateAttr.getValue()
        );
        const grbScheduled = !!(
          grbReviewMeetingDateAttr && grbReviewMeetingDateAttr.getValue()
        );

        if (currentStatus === null || currentStatus === undefined) {
          return false;
        }

        if (currentStatus === PROCESS_STEPS.DRAFT) {
          render(readyForReview ? "draft-admin" : "draft-requester");
          return true;
        }

        if (currentStatus === PROCESS_STEPS.INTAKE_REQUEST_REVIEW) {
          render("intake-review");
          return true;
        }

        if (currentStatus === PROCESS_STEPS.DRAFT_BUSINESS_CASE) {
          render(
            readyForReview ? "business-case-admin" : "business-case-requester",
          );
          return true;
        }

        if (currentStatus === PROCESS_STEPS.GRT_MEETING) {
          render("grt-meeting", { grtScheduled, grtMeetingDate });
          return true;
        }

        if (currentStatus === PROCESS_STEPS.FINAL_BUSINESS_CASE) {
          render(
            readyForReview
              ? "final-business-case-admin"
              : "final-business-case-requester",
          );
          return true;
        }

        if (currentStatus === PROCESS_STEPS.GRB_REVIEW) {
          render("grb-review", { grbScheduled, grbMeetingDate });
          return true;
        }

        if (currentStatus === PROCESS_STEPS.FINISHED) {
          render("finished", { decision });
          return true;
        }

        render("default");
        return true;
      }

      function scheduleStabilityRefreshes() {
        [200, 800, 1800].forEach((delay) => {
          window.setTimeout(updateUI, delay);
        });
      }

      function waitForFormData(startTime = Date.now()) {
        if (Date.now() - startTime > MAX_WAIT_MS) {
          updateUI();
          return;
        }

        const form = getParentForm();
        const statusAttr = getAttr(form, CURRENT_PROCESS_STATUS);
        const readyAttr = getAttr(form, READY_FOR_REVIEW);
        const grtMeetingDateAttr = getAttr(form, GRT_MEETING_DATE);
        const grbReviewMeetingDateAttr = getAttr(form, GRB_REVIEW_MEETING_DATE);
        const decisionAttr = getAttr(form, DECISION);

        if (!form || !statusAttr || !readyAttr) {
          window.setTimeout(() => waitForFormData(startTime), WAIT_INTERVAL_MS);
          return;
        }

        if (!listenersRegistered) {
          if (statusAttr.addOnChange) {
            statusAttr.addOnChange(function () {
              updateUI();
              scheduleStabilityRefreshes();
            });
          }
          if (readyAttr.addOnChange) {
            readyAttr.addOnChange(function () {
              updateUI();
              scheduleStabilityRefreshes();
            });
          }
          if (grtMeetingDateAttr?.addOnChange) {
            grtMeetingDateAttr.addOnChange(function () {
              updateUI();
              scheduleStabilityRefreshes();
            });
          }
          if (grbReviewMeetingDateAttr?.addOnChange) {
            grbReviewMeetingDateAttr.addOnChange(function () {
              updateUI();
              scheduleStabilityRefreshes();
            });
          }
          if (decisionAttr?.addOnChange) {
            decisionAttr.addOnChange(function () {
              updateUI();
              scheduleStabilityRefreshes();
            });
          }
          listenersRegistered = true;
        }

        updateUI();
        scheduleStabilityRefreshes();
      }

      document.addEventListener("DOMContentLoaded", function () {
        waitForFormData();
      });

      window.refreshRequestHelper = updateUI;
    </script>
  </head>

  <body>
    <div
      id="card"
      class="helper-card helper-card--info"
      role="status"
      aria-live="polite"
    >
      <div class="helper-title">
        <span id="icon" class="icon">ℹ️</span>
        <span id="titleText">Loading…</span>
      </div>
      <p id="subtitleText" class="helper-body"></p>
    </div>
  </body>
</html>
