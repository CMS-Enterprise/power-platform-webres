<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ready for Review Indicator</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: transparent;
        color: #323130;
      }

      .card {
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .subtitle {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      /* States */
      .state-review {
        background: #dff6dd; /* green-ish */
        border-color: #107c10;
      }

      .state-wait {
        background: #fff4ce; /* yellow-ish */
        border-color: #f2c811;
      }

      .icon {
        font-size: 22px;
        line-height: 1;
      }
    </style>
    <script>
      const READY_FOR_REVIEW = "cr69a_readyforreview";
      const CURRENT_PROCESS_STATUS = "new_admingovernancetasklist";
      const MAX_WAIT_MS = 5000;
      const WAIT_INTERVAL_MS = 100;
      const PROCESS_STEPS = {
        GRT_MEETING: 971270002,
        GRB_REVIEW: 971270004,
        FINISHED: 971270009,
      };

      function getParentForm() {
        return parent && parent.Xrm && parent.Xrm.Page ? parent.Xrm.Page : null;
      }

      function getAttr(form, schema) {
        return form ? form.getAttribute(schema) : null;
      }

      function render(state) {
        const card = document.getElementById("card");
        const icon = document.getElementById("icon");
        const title = document.getElementById("titleText");
        const subtitle = document.getElementById("subtitleText");

        if (!card || !icon || !title || !subtitle) return;

        console.log("render", state);

        if (state === "finished") {
          card.classList.remove("state-wait");
          card.classList.add("state-review");
          icon.textContent = "✅";
          title.textContent = "This request is finished";
          subtitle.textContent =
            "If you need to make changes, go to the Actions dropdown and re-open the request.";
        } else if (state === "grt-meeting") {
          card.classList.remove("state-wait");
          card.classList.add("state-review");
          icon.textContent = "⏳";
          title.textContent = "Awaiting results of the GRT meeting";
          subtitle.textContent =
            "Waiting for input from the GRT meeting. Once the meeting has finished, please put a link into the Meeting Minutes section of this Review and use the Actions dropdown to move this request to another step in the process.";
        } else if (state === "grb-review") {
          card.classList.remove("state-wait");
          card.classList.add("state-review");
          icon.textContent = "⏳";
          title.textContent = "Awaiting results of the GRB review";
          subtitle.textContent =
            "Waiting for input from the GRB review. Once the review has finished, please put a link into the Meeting Minutes section of this Review and use the Actions dropdown to move this request to another step in the process.";
        } else if (state === "review") {
          card.classList.remove("state-wait");
          card.classList.add("state-review");
          icon.textContent = "✅";
          title.textContent = "Your turn: Review this request";
          subtitle.textContent =
            "The requester has submitted changes. Please review and either approve or request edits.";
        } else {
          card.classList.remove("state-review");
          card.classList.add("state-wait");
          icon.textContent = "⏳";
          title.textContent = "Waiting on requester updates";
          subtitle.textContent =
            "Review is paused until the requester submits updates.";
        }
      }

      function updateUI() {
        const form = getParentForm();
        if (!form) return;

        const rfr = getAttr(form, READY_FOR_REVIEW);
        const statusAttr = getAttr(form, CURRENT_PROCESS_STATUS);
        const ready = !!(rfr && rfr.getValue());
        const currentStatus = statusAttr ? statusAttr.getValue() : null;
        console.log("current status", currentStatus);

        if (currentStatus === PROCESS_STEPS.GRT_MEETING) {
          render("grt-meeting");
          return;
        }

        if (currentStatus === PROCESS_STEPS.GRB_REVIEW) {
          render("grb-review");
          return;
        }

        if (currentStatus === PROCESS_STEPS.FINISHED) {
          render("finished");
          return;
        }

        render(ready ? "review" : "wait");
      }

      function waitForFormData(startTime = Date.now()) {
        const form = getParentForm();

        // Timeout guard
        if (Date.now() - startTime > MAX_WAIT_MS) {
          console.warn(
            "Ready for Review card: form data did not load within timeout.",
          );
          updateUI(); // attempt one last render
          return;
        }

        if (!form) {
          setTimeout(() => waitForFormData(startTime), WAIT_INTERVAL_MS);
          return;
        }

        const rfr = getAttr(form, READY_FOR_REVIEW);
        const statusAttr = getAttr(form, CURRENT_PROCESS_STATUS);
        if (!rfr || !statusAttr) {
          setTimeout(() => waitForFormData(startTime), WAIT_INTERVAL_MS);
          return;
        }

        // Registering onChange here rather than the form editor to keep this
        // component self-contained. If this web resource is removed, the listener
        // goes with it automatically.
        if (rfr.addOnChange) {
          rfr.addOnChange(updateUI);
        }
        if (statusAttr.addOnChange) {
          statusAttr.addOnChange(updateUI);
        }

        // Small delay to let the parent form finish populating field values
        setTimeout(updateUI, 300);
      }

      document.addEventListener("DOMContentLoaded", function () {
        // Start checking for form data availability
        waitForFormData();
      });
    </script>
  </head>

  <body>
    <div id="card" class="card state-wait" role="status" aria-live="polite">
      <div class="title">
        <span id="icon" class="icon">⏳</span>
        <span id="titleText">Loading…</span>
      </div>
      <p id="subtitleText" class="subtitle"></p>
    </div>
  </body>
</html>
