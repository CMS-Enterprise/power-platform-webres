<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --itgov-text: #323130;
        --itgov-card-radius: 12px;
        --itgov-card-border: rgba(0, 0, 0, 0.08);
        --itgov-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        --itgov-info-bg: #eff6fc;
        --itgov-info-border: #5c9bd5;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        line-height: 1.43;
        margin: 0;
        color: var(--itgov-text);
        background: transparent;
        overflow: hidden;
      }

      .helper-card {
        border-radius: var(--itgov-card-radius);
        padding: 16px 18px;
        box-shadow: var(--itgov-card-shadow);
        border: 1px solid var(--itgov-card-border);
        background: var(--itgov-info-bg);
        border-color: var(--itgov-info-border);
      }

      .helper-title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 6px 0;
      }

      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="helper-card">
      <div class="helper-title">Upload Documents</div>
      <p>
        To upload documents, click "Upload Documents" at the top of the page.
        Once uploaded, your documents will appear in the list below.
      </p>
    </div>
  </body>
</html>
