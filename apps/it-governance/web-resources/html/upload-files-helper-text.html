<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.43;
        margin: 0;
        color: #323130;
        overflow: hidden;
      }

      .container {
        border-left: 4px solid #ffbe2e;
        background-color: #faf3d1;
        border-radius: 3px;
        padding: 12px 16px;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      p {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">Upload Files</div>
      <p>
        To upload files, click "Upload Documents" at the top of the page. Once
        uploaded, your documents will appear in the list below.
      </p>
    </div>
  </body>
</html>
